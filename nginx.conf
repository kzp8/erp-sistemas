server {
    listen 80;
    server_name localhost;

    # Compresión gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Redirecciones automáticas para acceder a la administración de PocketBase
    # Garantiza que /_ , /admin o /pocketbase siempre vayan a /_/ con barra final
    location = /_ {
        return 301 /_/;
    }
    location = /admin {
        return 301 /_/;
    }
    location = /pocketbase {
        return 301 /_/;
    }

    # Proxy inverso a PocketBase API (con soporte SSE y WebSockets para realtime)
    location ^~ /api/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy inverso a la interfaz de administración de PocketBase
    location ^~ /_/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Caché optimizada para assets inmutables de Vite
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Enrutamiento SPA (React Router / fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
